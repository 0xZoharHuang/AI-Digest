name: Feature request
description: Propose a scoped capability or source improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Reader or operator problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true

  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - New or changed source contract
        - Observation/state model
        - Routing/package design
        - Research/context engineering
        - Brief/Wiki reading experience
        - Recovery/operations
        - Security/privacy
        - Documentation/community
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: For sources, include interface, unit, cursor, dedupe, revisions, coverage mode, and failure boundary.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Explain how the change can be verified without risking production data or external writes.
    validations:
      required: true
