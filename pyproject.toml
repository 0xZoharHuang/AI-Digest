[project]
name = "ai-intelligence-radar"
version = "0.3.0"
description = "Source-first daily intelligence radar with Codex research agents and Lark publishing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zohar Huang" }]
keywords = [
    "ai-agents",
    "daily-digest",
    "deep-research",
    "physical-ai",
    "robotics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "aiosqlite>=0.20,<1",
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "playwright==1.58.0",
    "pydantic>=2.10,<3",
    "rich>=13.9,<15",
    "trafilatura>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/0xZoharHuang/AI-Digest"
Repository = "https://github.com/0xZoharHuang/AI-Digest.git"
Issues = "https://github.com/0xZoharHuang/AI-Digest/issues"
Documentation = "https://github.com/0xZoharHuang/AI-Digest/tree/main/docs"

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<8",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
ai-digest = "ai_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_digest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ai_digest"]
branch = true
omit = [
    "*/agent_phases.py",
    "*/v3.py",
    "*/cli.py",
    "*/codex_runner.py",
    "*/collectors/*",
    "*/doctor.py",
    "*/pipeline.py",
    "*/publisher.py",
    "*/smoke.py",
    "*/x_provider.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_digest"]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
