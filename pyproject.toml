[project]
name = "ai-digest"
version = "0.1.0"
description = "AI Daily Digest - Automated X content aggregation with deep research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crawl4ai>=0.4",
    "anthropic>=0.40",
    "notion-client>=2.2",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "apscheduler>=3.10",
    "arxiv>=2.1",
    "duckduckgo-search>=6.0",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.1",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
