[x_list]
enabled = false
list_id = ""
seed_list_ids = ["1585430245762441216", "1353454915088052225", "226428000"]
target_members = 1100
poll_hours = [3, 7, 11, 15, 19, 23]
max_pages = 8

[x_for_you]
enabled = false
profile_dir = "~/Library/Application Support/ai-digest/browser-profile"
limit = 150
scroll_rounds = 30
hours = [7, 20]

[github]
enabled = true
per_query = 20
created_within_days = 365
pushed_within_days = 45
early_stars = "1..499"
emerging_stars = "500..5000"
queries = [
  "topic:robotics",
  "topic:robot-learning",
  "topic:embodied-ai",
  "\"vision language action\" in:name,description,readme",
  "topic:humanoid-robotics",
  "topic:world-model",
  "topic:reinforcement-learning",
  "topic:ai-agent",
  "topic:agent-framework",
  "topic:coding-agent",
  "topic:computer-use",
  "topic:mcp",
  "topic:multi-agent"
]

[arxiv]
enabled = true
allow_empty = true
categories = ["cs.RO", "cs.AI", "cs.LG", "cs.CV", "cs.CL", "stat.ML"]
rss_url = "https://export.arxiv.org/rss/{categories}"

[huggingface]
enabled = true
url = "https://huggingface.co/api/papers"
limit = 100

[hackernews]
enabled = true
surfaces = ["new", "top", "show"]
new_limit = 500
top_limit = 500
show_limit = 200

