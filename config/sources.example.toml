[x_list]
enabled = false
required = true
compliance_verified = false
list_id = ""
list_name = "AI Intelligence Radar"
bootstrap_mode = "full_seed_union_freeze"
seed_list_ids = ["1585430245762441216", "1353454915088052225", "226428000"]
target_members = 0
poll_hours = [3, 7, 11, 15, 19, 23]
max_pages = 8

[x_for_you]
enabled = false
required = false
personal_browser_risk_acknowledged = false
written_permission_confirmed = false
cookie_file = "config/twitter_cookies.json"
limit = 150
scroll_rounds = 45
refresh_rounds = 3
consecutive_empty = 3
delay_min_seconds = 2.0
delay_max_seconds = 5.0
max_consecutive_failures = 2
cooldown_hours = 6
hours = [7, 20]

[github]
enabled = true
per_query = 20
# GitHub Search permits 30 authenticated requests/minute. Keep two requests in reserve.
search_request_budget = 28
created_within_days = 365
recent_created_within_days = 45
pushed_within_days = 45
early_stars = "1..499"
emerging_stars = "500..5000"
crossing_stars = [500, 5000]
growth_6h_min_stars = 25
growth_24h_min_stars = 75
growth_7d_min_stars = 250
growth_event_cooldown_hours = 24
# Recheck a bounded, least-recently-checked slice of prior early-lane repos via core API.
early_watch_days = 365
early_watch_rechecks_per_poll = 20
queries = [
  "topic:robotics",
  "topic:robot-learning",
  "topic:embodied-ai",
  "\"vision language action\" in:name,description,readme",
  "topic:humanoid-robotics",
  "topic:world-model",
  "topic:reinforcement-learning",
  "topic:ai-agent",
  "topic:agent-framework",
  "topic:coding-agent",
  "topic:computer-use",
  "topic:mcp",
  "topic:multi-agent"
]

[arxiv]
enabled = true
allow_empty = true
categories = ["cs.RO", "cs.AI", "cs.LG", "cs.CV", "cs.CL", "stat.ML"]
rss_url = "https://export.arxiv.org/rss/{categories}"

[huggingface]
enabled = true
url = "https://huggingface.co/api/papers"
limit = 100

[hackernews]
enabled = true
surfaces = ["new", "top", "show"]
new_limit = 500
top_limit = 500
show_limit = 200

[[articles]]
id = "openai-news"
role = "primary"
kind = "rss"
url = "https://openai.com/news/rss.xml"
max_entries = 30
allowed_domains = ["openai.com"]

