timezone = "Asia/Shanghai"
runtime_root = "~/Library/Application Support/ai-digest"
shared_runtime_root = "~/Library/Application Support/ai-digest/queue"
daily_hour = 7
window_hours = 24
article_preview_chars = 4000
x_text_retention_days = 30

[codex]
phase2_reading_view = false
phase3_lean_instructions = false
phase2_engine = "semantic_labels_v1"
phase2_label_model = "gpt-5.6-luna"
phase2_label_reasoning = "medium"
phase2_text_only = true
phase2_subject_keys = true
phase2_evidence_packets = false
phase2_comparison_max_groups = 128
phase2_alias_model = "gpt-5.6-sol"
phase2_alias_reasoning = "high"
binary = "./node_modules/.bin/codex"
router_model = "gpt-5.6-sol"
router_reasoning = "high"
router_reader_model = "gpt-5.6-terra"
router_reader_reasoning = "high"
router_reader_concurrency = 4
router_decider_model = "gpt-5.6-terra"
router_decider_reasoning = "high"
router_decider_concurrency = 4
research_model = "gpt-5.6-sol"
research_reasoning = "medium"
brief_model = "gpt-5.6-terra"
brief_reasoning = "high"
phase3_admission_model = "gpt-5.6-sol"
phase3_admission_reasoning = "high"
phase3_exploration_fraction = 0.2
phase3_daily_agent_limit = 15
phase3_tail_batch_size = 10
phase3_tail_batch_max_bytes = 256000
phase3_tail_parallel_pool = true
phase3_dynamic_tasks = false
phase3_task_max_packages = 10
top_level_concurrency = 3
subagent_threads = 4
idle_timeout_seconds = 900

[lark]
home_node_token = ""
history_node_token = ""
binary = "./node_modules/.bin/lark-cli"
space_id = ""
receiver_open_id = ""
wiki_name = "AI Intelligence Radar"
wiki_base_url = "https://feishu.cn/wiki"
identity = "user"
dm_identity = "bot"
